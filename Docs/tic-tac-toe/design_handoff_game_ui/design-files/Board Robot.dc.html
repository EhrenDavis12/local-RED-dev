<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-8d34aa70-bd87-4199-9b49-90eb65f48fbb/styles.css">
<script src="_ds/nocturne-8d34aa70-bd87-4199-9b49-90eb65f48fbb/_ds_bundle.js"></script>
</helmet>
<div style="position:relative;width:100%">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:13px;width:100%">
    <sc-for list="{{ quads }}" as="q" hint-placeholder-count="9">
      <div style="position:relative;padding:6px;border-radius:9px;background:linear-gradient(180deg,#7b8fa6,#5f7488);box-shadow:0 0 0 3px #16202b,inset 0 3px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(22,32,43,.3)">
        <span style="position:absolute;left:4px;top:4px;width:4px;height:4px;border-radius:50%;background:#c9d6e3;box-shadow:0 0 0 1.5px #16202b"></span>
        <span style="position:absolute;right:4px;top:4px;width:4px;height:4px;border-radius:50%;background:#c9d6e3;box-shadow:0 0 0 1.5px #16202b"></span>
        <span style="position:absolute;left:4px;bottom:4px;width:4px;height:4px;border-radius:50%;background:#c9d6e3;box-shadow:0 0 0 1.5px #16202b"></span>
        <span style="position:absolute;right:4px;bottom:4px;width:4px;height:4px;border-radius:50%;background:#c9d6e3;box-shadow:0 0 0 1.5px #16202b"></span>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px">
          <sc-for list="{{ q.cells }}" as="c" hint-placeholder-count="9">
            <div style="position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center">
              <sc-if value="{{ c.x }}" hint-placeholder-val="{{ false }}">
                <span style="position:relative;width:23px;height:23px;display:block">
                  <span style="position:absolute;inset:0;border-radius:6px;background:#16202b"></span>
                  <span style="position:absolute;inset:0;border-radius:6px;background:#16202b;transform:rotate(45deg)"></span>
                  <span style="position:absolute;inset:2.5px;border-radius:5px;background:#ff4433;transform:rotate(45deg)"></span>
                  <span style="position:absolute;inset:2.5px;border-radius:5px;background:#ff4433"></span>
                  <span style="position:absolute;inset:4px;border-radius:50%;background:#ff6a55;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)"></span>
                  <span style="position:absolute;inset:8.5px;border-radius:50%;background:#16202b"></span>
                </span>
              </sc-if>
              <sc-if value="{{ c.o }}" hint-placeholder-val="{{ false }}">
                <span style="position:relative;width:23px;height:23px;display:block">
                  <span style="position:absolute;inset:0;background:#16202b;clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%)"></span>
                  <span style="position:absolute;inset:2.5px;background:#2bc4f5;clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%);box-shadow:none"></span>
                  <span style="position:absolute;left:3px;right:3px;top:4px;height:5px;background:rgba(255,255,255,.45);clip-path:polygon(18% 0,82% 0,68% 100%,32% 100%)"></span>
                  <span style="position:absolute;inset:8px;border-radius:50%;background:#16202b"></span>
                </span>
              </sc-if>
              <sc-if value="{{ c.ghostX }}" hint-placeholder-val="{{ false }}">
                <span style="position:relative;width:23px;height:23px;display:block;opacity:.4">
                  <span style="position:absolute;inset:0;border-radius:6px;background:#ff4433"></span>
                  <span style="position:absolute;inset:0;border-radius:6px;background:#ff4433;transform:rotate(45deg)"></span>
                  <span style="position:absolute;inset:8.5px;border-radius:50%;background:#16202b"></span>
                </span>
              </sc-if>
              <sc-if value="{{ c.ghostO }}" hint-placeholder-val="{{ false }}">
                <span style="position:relative;width:23px;height:23px;display:block;opacity:.4">
                  <span style="position:absolute;inset:0;background:#2bc4f5;clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%)"></span>
                  <span style="position:absolute;inset:8px;border-radius:50%;background:#16202b"></span>
                </span>
              </sc-if>
              <sc-if value="{{ c.pending }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-2px;border-radius:5px;border:3px dashed #ffffff;z-index:4"></span></sc-if>
              <sc-if value="{{ c.last }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-2px;border-radius:5px;border:3px solid #ffffff;box-shadow:0 0 0 2px #16202b,0 0 12px rgba(255,255,255,.8);z-index:4"></span></sc-if>
            </div>
          </sc-for>
        </div>
        <span style="position:absolute;inset:6px;pointer-events:none">
          <span style="position:absolute;top:7%;bottom:7%;left:33.33%;width:3px;margin-left:-1.5px;border-radius:2px;background:#2b3a4c;box-shadow:1px 0 0 rgba(255,255,255,.22)"></span>
          <span style="position:absolute;top:7%;bottom:7%;left:66.67%;width:3px;margin-left:-1.5px;border-radius:2px;background:#2b3a4c;box-shadow:1px 0 0 rgba(255,255,255,.22)"></span>
          <span style="position:absolute;left:7%;right:7%;top:33.33%;height:3px;margin-top:-1.5px;border-radius:2px;background:#2b3a4c;box-shadow:0 1px 0 rgba(255,255,255,.22)"></span>
          <span style="position:absolute;left:7%;right:7%;top:66.67%;height:3px;margin-top:-1.5px;border-radius:2px;background:#2b3a4c;box-shadow:0 1px 0 rgba(255,255,255,.22)"></span>
        </span>
        <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:0;border-radius:9px;box-shadow:inset 0 0 0 3px rgba(255,200,44,.75);pointer-events:none"></span>
        </sc-if>
        <sc-if value="{{ q.locked }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:0;border-radius:9px;background:rgba(22,32,43,0.5);z-index:2;pointer-events:none"></span>
        </sc-if>
        <sc-if value="{{ q.dest }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:-5px;border-radius:13px;border:3px dashed #ffffff;background:rgba(255,255,255,0.1);z-index:3;pointer-events:none"></span>
        </sc-if>
        <sc-if value="{{ q.forced }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:-5px;border-radius:13px;border:4px solid #ffc82c;box-shadow:0 0 0 2px #16202b,0 0 20px 5px rgba(255,200,44,.7);z-index:3;pointer-events:none"></span>
        </sc-if>
        <sc-if value="{{ q.cx }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:0;border-radius:9px;background:rgba(255,68,51,0.22);z-index:2;display:flex;align-items:center;justify-content:center">
            <span style="position:relative;width:68px;height:68px;display:block">
              <span style="position:absolute;inset:0;border-radius:16px;background:#16202b"></span>
              <span style="position:absolute;inset:0;border-radius:16px;background:#16202b;transform:rotate(45deg)"></span>
              <span style="position:absolute;inset:5px;border-radius:13px;background:#ff4433;transform:rotate(45deg)"></span>
              <span style="position:absolute;inset:5px;border-radius:13px;background:#ff4433"></span>
              <span style="position:absolute;inset:11px;border-radius:50%;background:#ff6a55;box-shadow:inset 0 4px 0 rgba(255,255,255,.4)"></span>
              <span style="position:absolute;inset:25px;border-radius:50%;background:#16202b"></span>
            </span>
          </span>
        </sc-if>
        <sc-if value="{{ q.co }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:0;border-radius:9px;background:rgba(43,196,245,0.22);z-index:2;display:flex;align-items:center;justify-content:center">
            <span style="position:relative;width:68px;height:68px;display:block">
              <span style="position:absolute;inset:0;background:#16202b;clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%)"></span>
              <span style="position:absolute;inset:5px;background:#2bc4f5;clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%)"></span>
              <span style="position:absolute;left:11px;right:11px;top:11px;height:14px;background:rgba(255,255,255,.45);clip-path:polygon(18% 0,82% 0,68% 100%,32% 100%)"></span>
              <span style="position:absolute;inset:24px;border-radius:50%;background:#16202b"></span>
            </span>
          </span>
        </sc-if>
        <sc-if value="{{ q.cat }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:0;border-radius:9px;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#8a6a4a;background-image:radial-gradient(40% 35% at 25% 30%,rgba(214,122,60,.85),transparent 60%),radial-gradient(45% 40% at 72% 68%,rgba(160,86,38,.9),transparent 60%),radial-gradient(30% 30% at 60% 22%,rgba(120,70,34,.9),transparent 60%)">
            <span style="font:700 11px Inter,system-ui,sans-serif;letter-spacing:.1em;color:#fff2df;text-shadow:0 2px 0 rgba(60,30,10,.65)">SCRAP</span>
          </span>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <span style="position:absolute;inset:0;pointer-events:none">
    <span style="position:absolute;top:-4px;bottom:-4px;left:32.8%;width:11px;margin-left:-5.5px;border-radius:3px;background:repeating-linear-gradient(135deg,#ffc82c 0 7px,#16202b 7px 14px);box-shadow:0 0 0 2.5px #16202b,0 3px 6px rgba(10,18,26,.5)"></span>
    <span style="position:absolute;top:-4px;bottom:-4px;left:67.2%;width:11px;margin-left:-5.5px;border-radius:3px;background:repeating-linear-gradient(135deg,#ffc82c 0 7px,#16202b 7px 14px);box-shadow:0 0 0 2.5px #16202b,0 3px 6px rgba(10,18,26,.5)"></span>
    <span style="position:absolute;left:-4px;right:-4px;top:32.8%;height:11px;margin-top:-5.5px;border-radius:3px;background:repeating-linear-gradient(135deg,#ffc82c 0 7px,#16202b 7px 14px);box-shadow:0 0 0 2.5px #16202b,0 3px 6px rgba(10,18,26,.5)"></span>
    <span style="position:absolute;left:-4px;right:-4px;top:67.2%;height:11px;margin-top:-5.5px;border-radius:3px;background:repeating-linear-gradient(135deg,#ffc82c 0 7px,#16202b 7px 14px);box-shadow:0 0 0 2.5px #16202b,0 3px 6px rgba(10,18,26,.5)"></span>
  </span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:370,&quot;height&quot;:370},&quot;quads&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{cells:Array&lt;{x?:boolean,o?:boolean,last?:boolean,pending?:boolean,ghostX?:boolean,ghostO?:boolean}&gt;,open?:boolean,locked?:boolean,forced?:boolean,dest?:boolean,cx?:boolean,co?:boolean,cat?:boolean}&gt;&quot;}}"></script>
</body>
</html>
