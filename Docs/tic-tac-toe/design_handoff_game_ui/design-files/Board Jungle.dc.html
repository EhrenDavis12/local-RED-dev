<div style="position:relative;width:100%">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:13px;width:100%">
    <sc-for list="{{ quads }}" as="q" hint-placeholder-count="9">
      <div style="position:relative;padding:6px;border-radius:12px;background:linear-gradient(180deg,#6fd49b,#45b378);box-shadow:0 0 0 3px #10382a,inset 0 3px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(16,56,42,.22)">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px">
          <sc-for list="{{ q.cells }}" as="c" hint-placeholder-count="9">
            <div style="position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center">
              <sc-if value="{{ c.x }}" hint-placeholder-val="{{ false }}">
                <span style="position:relative;width:24px;height:24px;display:block">
                  <span style="position:absolute;inset:0;background:#10382a;clip-path:polygon(50% 0,58% 14%,62% 32%,70% 22%,84% 6%,80% 28%,74% 46%,88% 60%,85% 80%,68% 95%,50% 100%,32% 95%,15% 80%,12% 60%,26% 46%,20% 28%,16% 6%,30% 22%,38% 32%,42% 14%)"></span>

                </span>
              </sc-if>
              <sc-if value="{{ c.o }}" hint-placeholder-val="{{ false }}">
                <span style="position:relative;width:23px;height:23px;display:block">
                  <span style="position:absolute;inset:0;background:#10382a;clip-path:polygon(50% 0,90% 32%,76% 100%,24% 100%,10% 32%)"></span>
                  <span style="position:absolute;inset:2.5px;background:#7b5cf6;clip-path:polygon(50% 0,90% 32%,76% 100%,24% 100%,10% 32%)"></span>
                  <span style="position:absolute;left:6px;top:4px;width:5px;height:9px;border-radius:3px;background:rgba(255,255,255,.5)"></span>
                </span>
              </sc-if>
              <sc-if value="{{ c.ghostX }}" hint-placeholder-val="{{ false }}">
                <span style="width:24px;height:24px;display:block;opacity:.42;background:#ff8a1e;clip-path:polygon(50% 0,58% 14%,62% 32%,70% 22%,84% 6%,80% 28%,74% 46%,88% 60%,85% 80%,68% 95%,50% 100%,32% 95%,15% 80%,12% 60%,26% 46%,20% 28%,16% 6%,30% 22%,38% 32%,42% 14%)"></span>
              </sc-if>
              <sc-if value="{{ c.ghostO }}" hint-placeholder-val="{{ false }}">
                <span style="width:23px;height:23px;display:block;opacity:.42;background:#7b5cf6;clip-path:polygon(50% 0,90% 32%,76% 100%,24% 100%,10% 32%)"></span>
              </sc-if>
              <sc-if value="{{ c.pending }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-2px;border-radius:6px;border:3px dashed #ffffff;z-index:4"></span></sc-if>
              <sc-if value="{{ c.last }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:-2px;border-radius:6px;border:3px solid #ffffff;box-shadow:0 0 0 2px #10382a,0 0 12px rgba(255,255,255,.8);z-index:4"></span></sc-if>
            </div>
          </sc-for>
        </div>
        <span style="position:absolute;inset:6px;pointer-events:none">
          <span style="position:absolute;top:7%;bottom:7%;left:33.33%;width:3px;margin-left:-1.5px;border-radius:3px;background:#27865c;box-shadow:1px 0 0 rgba(255,255,255,.3)"></span>

        </span>
        <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 3px rgba(255,209,46,.8);pointer-events:none"></span>
        </sc-if>
        <sc-if value="{{ q.locked }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:0;border-radius:12px;background:rgba(16,56,42,0.5);z-index:2;pointer-events:none"></span>
        </sc-if>
        <sc-if value="{{ q.dest }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:-5px;border-radius:16px;border:3px dashed #ffffff;background:rgba(255,255,255,0.12);z-index:3;pointer-events:none"></span>
        </sc-if>
        <sc-if value="{{ q.forced }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:-5px;border-radius:16px;border:4px solid #ffd12e;box-shadow:0 0 0 2px #10382a,0 0 20px 5px rgba(255,209,46,.7);z-index:3;pointer-events:none"></span>
        </sc-if>
        <sc-if value="{{ q.cx }}" hint-placeholder-val="{{ false }}">

              <span style="position:absolute;inset:4px;background:#ff8a1e;clip-path:polygon(50% 0,58% 14%,62% 32%,70% 22%,84% 6%,80% 28%,74% 46%,88% 60%,85% 80%,68% 95%,50% 100%,32% 95%,15% 80%,12% 60%,26% 46%,20% 28%,16% 6%,30% 22%,38% 32%,42% 14%)"></span>
            </span>
          </span>
        </sc-if>
        <sc-if value="{{ q.co }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:0;border-radius:12px;background:rgba(123,92,246,0.26);z-index:2;display:flex;align-items:center;justify-content:center">
            <span style="position:relative;width:68px;height:68px;display:block">
              <span style="position:absolute;inset:0;background:#10382a;clip-path:polygon(50% 0,90% 32%,76% 100%,24% 100%,10% 32%)"></span>
              <span style="position:absolute;inset:5px;background:#7b5cf6;clip-path:polygon(50% 0,90% 32%,76% 100%,24% 100%,10% 32%)"></span>
              <span style="position:absolute;left:17px;top:11px;width:13px;height:26px;border-radius:8px;background:rgba(255,255,255,.45)"></span>
            </span>
          </span>
        </sc-if>
        <sc-if value="{{ q.cat }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:0;border-radius:12px;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#7a5a3a;background-image:radial-gradient(45% 40% at 30% 32%,rgba(150,110,70,.95),transparent 62%),radial-gradient(45% 40% at 70% 66%,rgba(96,68,40,.95),transparent 62%)">
            <span style="font:700 11px Inter,system-ui,sans-serif;letter-spacing:.1em;color:#fff3e0;text-shadow:0 2px 0 rgba(45,28,12,.7)">MUD</span>
          </span>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <span style="position:absolute;inset:0;pointer-events:none">
    <span style="position:absolute;top:-4px;bottom:-4px;left:32.8%;width:12px;margin-left:-6px;border-radius:5px;background:linear-gradient(90deg,#9bbd3a,#d6e86a 40%,#bcd352 70%,#8aa832);box-shadow:0 0 0 2.5px #10382a,0 3px 6px rgba(12,44,32,.45)">

      <span style="position:absolute;left:-1px;right:-1px;top:44%;height:5px;background:#8aa832;box-shadow:0 0 0 2px #10382a"></span>
